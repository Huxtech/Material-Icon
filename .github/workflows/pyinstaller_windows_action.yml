name: Build Windows Executable

on:
  push:
    branches:
      - main  # Change to your default branch name if different

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Match your local Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller kivy kivymd==1.2.0
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Run Build Script
        run: python build.py

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Material-Icon-Executable
          path: dist/Material Icon.exe