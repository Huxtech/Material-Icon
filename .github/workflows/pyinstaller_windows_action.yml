name: Build Windows Executable

on:
  push:
    branches:
      - main  # Change to your default branch name if different

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Match your local Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller kivy kivymd==1.2.0 kivy_deps.angle
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Setup Mesa3D (Software OpenGL 2.0+ for Headless CI)
        run: |
          curl.exe -L --output mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/23.1.5/mesa3d-23.1.5-release-msvc.7z
          7z x mesa.7z -oMesa
          copy Mesa\x64\opengl32.dll .
          copy Mesa\x64\opengl32.dll C:\Windows\System32\opengl32.dll -Force

      - name: Run Build Script
        env:
          KIVY_GL_BACKEND: angle_sdl2
        run: python build.py

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Material-Icon-Executable
          path: dist/Material Icon.exe